<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Hull -->
  <ellipse cx="200" cy="60" rx="160" ry="35" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- Conning tower -->
  <rect x="170" y="20" width="50" height="30" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- Periscope -->
  <line x1="195" y1="5" x2="195" y2="20" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="195" cy="5" r="3" fill="#4a90d9"/>
  <!-- Propeller -->
  <circle cx="365" cy="60" r="8" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="365" y1="50" x2="365" y2="70" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="355" y1="55" x2="375" y2="65" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- Porthole -->
  <circle cx="140" cy="55" r="5" fill="none" stroke="#7ab3e0" stroke-width="1"/>
  <circle cx="160" cy="55" r="5" fill="none" stroke="#7ab3e0" stroke-width="1"/>
  <circle cx="240" cy="55" r="5" fill="none" stroke="#7ab3e0" stroke-width="1"/>
  <circle cx="260" cy="55" r="5" fill="none" stroke="#7ab3e0" stroke-width="1"/>
  <!-- Korean flag mark -->
  <circle cx="200" cy="55" r="6" fill="#4a90d9" opacity="0.5"/>
</svg>
