<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -22 480 166" fill="none">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="45%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <radialGradient id="porthole" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="propHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="60%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </radialGradient>
    <radialGradient id="bladeGrad" cx="436" cy="80" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="10%" stop-color="#80deea"/>
      <stop offset="50%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0277bd" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Hull shadow -->
  <ellipse cx="240" cy="120" rx="178" ry="7" fill="#000" opacity="0.2"/>

  <!-- Main hull -->
  <path d="M 66 80
    C 66 56, 86 45, 112 43
    L 346 43
    C 381 43, 402 56, 410 70
    C 415 78, 415 88, 410 97
    C 402 110, 381 118, 346 118
    L 112 118
    C 86 118, 66 106, 66 90 Z"
    fill="url(#hull)" stroke="#80deea" stroke-width="2"/>

  <!-- Hull top sheen -->
  <path d="M 112 48 L 340 46 C 374 46 395 57 405 70"
    stroke="#b3e5fc" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- Bow dome -->
  <path d="M 66 90 C 52 90, 36 86, 30 80 C 36 74, 52 70, 66 70 Z"
    fill="#0288d1" stroke="#80deea" stroke-width="1.5"/>

  <!-- Torpedo tubes -->
  <rect x="28" y="71" width="24" height="7" rx="3.5" fill="#01579b" stroke="#40c4ff" stroke-width="1.2"/>
  <rect x="28" y="80" width="24" height="7" rx="3.5" fill="#01579b" stroke="#40c4ff" stroke-width="1.2"/>
  <circle cx="30" cy="74.5" r="2" fill="#80deea" opacity="0.7"/>
  <circle cx="30" cy="83.5" r="2" fill="#80deea" opacity="0.7"/>

  <!-- Bow planes -->
  <path d="M 132 83 L 102 63 L 108 61 L 137 81 Z" fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>
  <path d="M 132 97 L 102 117 L 108 119 L 137 99 Z" fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>

  <!-- Stern planes -->
  <path d="M 364 83 L 398 63 L 402 66 L 367 85 Z" fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>
  <path d="M 364 97 L 398 117 L 402 114 L 367 95 Z" fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>

  <!-- Conning tower -->
  <path d="M 205 43 L 205 18 C 205 12, 210 9, 218 9 L 265 9 C 273 9, 278 12, 278 18 L 278 43 Z"
    fill="url(#tower)" stroke="#80deea" stroke-width="2"/>
  <line x1="205" y1="31" x2="278" y2="31" stroke="#b3e5fc" stroke-width="0.9" opacity="0.5"/>

  <!-- Tower windows -->
  <rect x="212" y="14" width="14" height="11" rx="3" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="1.3"/>
  <rect x="233" y="14" width="14" height="11" rx="3" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="1.3"/>
  <rect x="254" y="14" width="14" height="11" rx="3" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="1.3"/>
  <line x1="214" y1="16" x2="217" y2="22" stroke="white" stroke-width="1" opacity="0.35"/>
  <line x1="235" y1="16" x2="238" y2="22" stroke="white" stroke-width="1" opacity="0.35"/>
  <line x1="256" y1="16" x2="259" y2="22" stroke="white" stroke-width="1" opacity="0.35"/>

  <!-- Tower hatch -->
  <ellipse cx="241" cy="11" rx="14" ry="4" fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>

  <!-- Periscope -->
  <line x1="218" y1="9" x2="218" y2="2" stroke="#40c4ff" stroke-width="2.5"/>
  <line x1="214" y1="2" x2="227" y2="2" stroke="#40c4ff" stroke-width="2"/>
  <circle cx="227" cy="2" r="3.5" fill="#80deea"/>
  <circle cx="227" cy="2" r="1.8" fill="#e1f5fe"/>

  <!-- Radar mast -->
  <line x1="262" y1="9" x2="262" y2="3" stroke="#4dd0e1" stroke-width="1.8"/>
  <line x1="257" y1="6" x2="267" y2="6" stroke="#4dd0e1" stroke-width="1.2"/>
  <rect x="259" y="2" width="6" height="4" rx="1" fill="#0277bd" stroke="#4dd0e1" stroke-width="1"/>

  <!-- Hull hatch -->
  <ellipse cx="241" cy="46" rx="18" ry="4.5" fill="#0277bd" stroke="#4dd0e1" stroke-width="1.3"/>
  <line x1="223" y1="46" x2="259" y2="46" stroke="#b3e5fc" stroke-width="0.9" opacity="0.6"/>

  <!-- Portholes -->
  <circle cx="148" cy="80" r="9" fill="#01579b" stroke="#4dd0e1" stroke-width="1.6"/>
  <circle cx="148" cy="80" r="7" fill="url(#porthole)"/>
  <circle cx="144" cy="77" r="2.5" fill="white" opacity="0.35"/>

  <circle cx="174" cy="80" r="9" fill="#01579b" stroke="#4dd0e1" stroke-width="1.6"/>
  <circle cx="174" cy="80" r="7" fill="url(#porthole)"/>
  <circle cx="170" cy="77" r="2.5" fill="white" opacity="0.35"/>

  <!-- Center navy emblem -->
  <circle cx="241" cy="80" r="13" fill="#0277bd" stroke="#40c4ff" stroke-width="1.8"/>
  <circle cx="241" cy="80" r="10" fill="none" stroke="#80deea" stroke-width="1" opacity="0.7"/>
  <circle cx="241" cy="80" r="4" fill="#40c4ff" opacity="0.8"/>
  <line x1="235" y1="80" x2="247" y2="80" stroke="#b3e5fc" stroke-width="0.9" opacity="0.6"/>
  <line x1="241" y1="74" x2="241" y2="86" stroke="#b3e5fc" stroke-width="0.9" opacity="0.6"/>

  <circle cx="302" cy="80" r="9" fill="#01579b" stroke="#4dd0e1" stroke-width="1.6"/>
  <circle cx="302" cy="80" r="7" fill="url(#porthole)"/>
  <circle cx="298" cy="77" r="2.5" fill="white" opacity="0.35"/>

  <circle cx="328" cy="80" r="9" fill="#01579b" stroke="#4dd0e1" stroke-width="1.6"/>
  <circle cx="328" cy="80" r="7" fill="url(#porthole)"/>
  <circle cx="324" cy="77" r="2.5" fill="white" opacity="0.35"/>

  <!-- Hull panel lines -->
  <line x1="112" y1="43" x2="112" y2="118" stroke="#40c4ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="346" y1="43" x2="346" y2="118" stroke="#40c4ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Rudder -->
  <path d="M 402 80 L 420 57 L 426 61 L 407 83 Z" fill="#0277bd" stroke="#4dd0e1" stroke-width="1.3"/>
  <path d="M 402 80 L 420 103 L 426 99 L 407 77 Z" fill="#0277bd" stroke="#4dd0e1" stroke-width="1.3"/>

  <!-- Propeller shaft -->
  <rect x="410" y="77" width="26" height="6" rx="3" fill="#0277bd" stroke="#40c4ff" stroke-width="1"/>

  <!-- Propeller hub (outer ring static) -->
  <circle cx="436" cy="80" r="7" fill="#0277bd" stroke="#4dd0e1" stroke-width="1.8"/>
  <!-- Spinning: blades + inner hub -->
  <g>
    <!-- 5 elegant swept blades (template points 12 o'clock, rotated 72° each) -->
    <path d="M 436,80 C 441,77 445,66 441,58 C 439,55 435,55 432,58 C 428,65 430,76 436,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.7"/>
    <path transform="rotate(72 436 80)"
      d="M 436,80 C 441,77 445,66 441,58 C 439,55 435,55 432,58 C 428,65 430,76 436,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.7"/>
    <path transform="rotate(144 436 80)"
      d="M 436,80 C 441,77 445,66 441,58 C 439,55 435,55 432,58 C 428,65 430,76 436,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.7"/>
    <path transform="rotate(216 436 80)"
      d="M 436,80 C 441,77 445,66 441,58 C 439,55 435,55 432,58 C 428,65 430,76 436,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.7"/>
    <path transform="rotate(288 436 80)"
      d="M 436,80 C 441,77 445,66 441,58 C 439,55 435,55 432,58 C 428,65 430,76 436,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.7"/>
    <!-- Inner hub cap -->
    <circle cx="436" cy="80" r="5" fill="url(#propHub)" stroke="#40c4ff" stroke-width="0.8"/>
    <circle cx="436" cy="80" r="2.2" fill="#e1f5fe" opacity="0.85"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 436 80" to="360 436 80" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- ===== 뽀글뽀글 버블 (SMIL 애니메이션) ===== -->
  <!-- Bubble 1 -->
  <circle cx="456" cy="88" r="4.5" fill="none" stroke="#80deea" stroke-width="1.4">
    <animate attributeName="cy" from="88" to="52" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.8;0.6;0" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" from="4.5" to="8" dur="1.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <!-- Bubble 2 -->
  <circle cx="465" cy="75" r="3" fill="none" stroke="#b3e5fc" stroke-width="1.2">
    <animate attributeName="cy" from="75" to="42" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="opacity" values="0.7;0.5;0" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="r" from="3" to="6" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <!-- Bubble 3 -->
  <circle cx="459" cy="95" r="3.5" fill="none" stroke="#80deea" stroke-width="1.2">
    <animate attributeName="cy" from="95" to="63" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0.6;0.4;0" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="r" from="3.5" to="7" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <!-- Bubble 4 -->
  <circle cx="471" cy="84" r="2.5" fill="none" stroke="#b3e5fc" stroke-width="1">
    <animate attributeName="cy" from="84" to="55" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="opacity" values="0.7;0.4;0" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="r" from="2.5" to="5.5" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <!-- Bubble 5 -->
  <circle cx="463" cy="70" r="2" fill="#b3e5fc" opacity="0.5">
    <animate attributeName="cy" from="70" to="40" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0.5;0.3;0" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="r" from="2" to="5" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <!-- Bubble 6 -->
  <circle cx="475" cy="91" r="4" fill="none" stroke="#80deea" stroke-width="1.3">
    <animate attributeName="cy" from="91" to="58" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0.8;0.5;0" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="r" from="4" to="7.5" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <!-- Bubble 7 small -->
  <circle cx="469" cy="100" r="2" fill="none" stroke="#4dd0e1" stroke-width="1">
    <animate attributeName="cy" from="100" to="72" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="opacity" values="0.6;0.3;0" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="r" from="2" to="4.5" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Sonar rings at bow -->
  <ellipse cx="32" cy="80" rx="14" ry="9" fill="none" stroke="#40c4ff" stroke-width="0.9" opacity="0.22"/>
  <ellipse cx="32" cy="80" rx="23" ry="15" fill="none" stroke="#40c4ff" stroke-width="0.7" opacity="0.12"/>

  <!-- ===== 태극기 (Korean National Flag) ===== -->
  <!-- Flagpole -->
  <line x1="248" y1="9" x2="248" y2="-18" stroke="#b3e5fc" stroke-width="1.5"/>
  <!-- Flag body -->
  <rect x="248" y="-20" width="30" height="18" fill="white" stroke="#c0c0c0" stroke-width="0.5" rx="0.5"/>
  <!-- Taeguk: center (263,-11), radius 4.5, rotated -45° for Korean flag orientation -->
  <g transform="rotate(-45 263 -11)">
    <path d="M 263,-15.5 A 4.5,4.5 0 0,1 263,-6.5 A 2.25,2.25 0 0,1 263,-11 A 2.25,2.25 0 0,0 263,-15.5 Z" fill="#cd2e3a"/>
    <path d="M 263,-15.5 A 4.5,4.5 0 0,0 263,-6.5 A 2.25,2.25 0 0,0 263,-11 A 2.25,2.25 0 0,1 263,-15.5 Z" fill="#003478"/>
  </g>
  <!-- Trigrams (simplified) -->
  <!-- Top-left: 건(☰) 3 solid lines -->
  <g transform="rotate(45 250 -18)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="248" y1="-19.5" x2="252" y2="-19.5"/>
    <line x1="248" y1="-18.2" x2="252" y2="-18.2"/>
    <line x1="248" y1="-16.9" x2="252" y2="-16.9"/>
  </g>
  <!-- Top-right: 감(☵) broken/solid/broken -->
  <g transform="rotate(-45 275 -18)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="273" y1="-19.5" x2="274.5" y2="-19.5"/>
    <line x1="275.5" y1="-19.5" x2="277" y2="-19.5"/>
    <line x1="273" y1="-18.2" x2="277" y2="-18.2"/>
    <line x1="273" y1="-16.9" x2="274.5" y2="-16.9"/>
    <line x1="275.5" y1="-16.9" x2="277" y2="-16.9"/>
  </g>
  <!-- Bottom-left: 리(☲) solid/broken/solid -->
  <g transform="rotate(45 250 -4)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="248" y1="-5.5" x2="252" y2="-5.5"/>
    <line x1="248" y1="-4.2" x2="249.5" y2="-4.2"/>
    <line x1="250.5" y1="-4.2" x2="252" y2="-4.2"/>
    <line x1="248" y1="-2.9" x2="252" y2="-2.9"/>
  </g>
  <!-- Bottom-right: 곤(☷) 3 broken lines -->
  <g transform="rotate(-45 275 -4)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="273" y1="-5.5" x2="274.5" y2="-5.5"/>
    <line x1="275.5" y1="-5.5" x2="277" y2="-5.5"/>
    <line x1="273" y1="-4.2" x2="274.5" y2="-4.2"/>
    <line x1="275.5" y1="-4.2" x2="277" y2="-4.2"/>
    <line x1="273" y1="-2.9" x2="274.5" y2="-2.9"/>
    <line x1="275.5" y1="-2.9" x2="277" y2="-2.9"/>
  </g>
</svg>
