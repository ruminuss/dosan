<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -22 480 166" fill="none">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <radialGradient id="porthole" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="propHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="60%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </radialGradient>
    <radialGradient id="bladeGrad" cx="448" cy="80" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="10%" stop-color="#80deea"/>
      <stop offset="55%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0277bd" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Hull shadow -->
  <ellipse cx="236" cy="123" rx="196" ry="5" fill="#000" opacity="0.13"/>

  <!-- ===== MAIN HULL (KSS-III streamlined teardrop profile) ===== -->
  <path d="M 25,80
    C 33,62 50,55 68,54
    L 375,54
    C 400,54 422,62 436,72
    C 441,76 444,78 446,80
    C 444,82 441,84 436,88
    C 422,98 400,106 375,106
    L 68,106
    C 50,105 33,98 25,80 Z"
    fill="url(#hull)" stroke="#40c4ff" stroke-width="1.5"/>

  <!-- Hull top sheen -->
  <path d="M 68,57 L 370,55 C 396,55 418,62 432,71"
    stroke="#b3e5fc" stroke-width="1" opacity="0.35" fill="none"/>

  <!-- ===== 6x 533mm BOW TORPEDO TUBES ===== -->
  <!-- Front column (3 tubes) -->
  <circle cx="32" cy="70" r="3.2" fill="#01579b" stroke="#40c4ff" stroke-width="1.2"/>
  <circle cx="32" cy="80" r="3.2" fill="#01579b" stroke="#40c4ff" stroke-width="1.2"/>
  <circle cx="32" cy="90" r="3.2" fill="#01579b" stroke="#40c4ff" stroke-width="1.2"/>
  <circle cx="32" cy="70" r="1.6" fill="#0a1f3e"/>
  <circle cx="32" cy="80" r="1.6" fill="#0a1f3e"/>
  <circle cx="32" cy="90" r="1.6" fill="#0a1f3e"/>
  <!-- Rear column (3 tubes) -->
  <circle cx="43" cy="74" r="3.0" fill="#01579b" stroke="#29b6f6" stroke-width="1"/>
  <circle cx="43" cy="80" r="3.0" fill="#01579b" stroke="#29b6f6" stroke-width="1"/>
  <circle cx="43" cy="86" r="3.0" fill="#01579b" stroke="#29b6f6" stroke-width="1"/>
  <circle cx="43" cy="74" r="1.4" fill="#0a2240"/>
  <circle cx="43" cy="80" r="1.4" fill="#0a2240"/>
  <circle cx="43" cy="86" r="1.4" fill="#0a2240"/>

  <!-- ===== SAIL / CONNING TOWER (raked leading edge, KSS-III style) ===== -->
  <path d="M 130,54 C 131,40 135,26 138,18 L 172,18 L 172,54 Z"
    fill="url(#sail)" stroke="#80deea" stroke-width="1.8"/>
  <!-- Sail sheen -->
  <line x1="140" y1="21" x2="170" y2="19" stroke="#b3e5fc" stroke-width="0.8" opacity="0.45"/>
  <!-- Sail viewport windows (3) -->
  <rect x="142" y="26" width="9" height="7" rx="2" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="1"/>
  <rect x="153" y="26" width="9" height="7" rx="2" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="1"/>
  <rect x="164" y="26" width="7" height="7" rx="1.5" fill="url(#porthole)" stroke="#4dd0e1" stroke-width="0.9"/>
  <!-- Window reflections -->
  <line x1="144" y1="28" x2="147" y2="31" stroke="white" stroke-width="0.9" opacity="0.35"/>
  <line x1="155" y1="28" x2="158" y2="31" stroke="white" stroke-width="0.9" opacity="0.35"/>

  <!-- ===== FAIRWATER PLANES (sail planes, mid-sail) ===== -->
  <!-- Starboard -->
  <path d="M 172,34 L 202,38 L 201,42 L 172,40 Z"
    fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>
  <!-- Port -->
  <path d="M 130,34 L 100,38 L 101,42 L 130,40 Z"
    fill="#0277bd" stroke="#40c4ff" stroke-width="1.2"/>

  <!-- ===== MASTS (on sail top) ===== -->
  <!-- Attack periscope -->
  <line x1="148" y1="18" x2="148" y2="9" stroke="#40c4ff" stroke-width="2.2"/>
  <line x1="145" y1="9" x2="156" y2="9" stroke="#40c4ff" stroke-width="1.8"/>
  <circle cx="156" cy="9" r="3" fill="#80deea"/>
  <circle cx="156" cy="9" r="1.5" fill="#e1f5fe"/>
  <!-- Search periscope -->
  <line x1="158" y1="18" x2="158" y2="10" stroke="#29b6f6" stroke-width="2"/>
  <rect x="155" y="7" width="8" height="5" rx="1.2" fill="#0277bd" stroke="#40c4ff" stroke-width="0.9"/>
  <!-- ESM / radar mast -->
  <line x1="168" y1="18" x2="168" y2="11" stroke="#4dd0e1" stroke-width="1.6"/>
  <line x1="164" y1="14" x2="173" y2="14" stroke="#4dd0e1" stroke-width="1.1"/>
  <circle cx="168" cy="11" r="2.2" fill="#0277bd" stroke="#4dd0e1" stroke-width="0.9"/>

  <!-- ===== K-VLS HATCHES (6 cells aft of sail) ===== -->
  <rect x="176" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <rect x="183" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <rect x="190" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <rect x="197" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <rect x="204" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <rect x="211" y="51" width="5.5" height="4" rx="0.5" fill="#0277bd" stroke="#29b6f6" stroke-width="0.8"/>
  <!-- VLS hatch highlights -->
  <line x1="176" y1="51.5" x2="181.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>
  <line x1="183" y1="51.5" x2="188.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>
  <line x1="190" y1="51.5" x2="195.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>
  <line x1="197" y1="51.5" x2="202.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>
  <line x1="204" y1="51.5" x2="209.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>
  <line x1="211" y1="51.5" x2="216.5" y2="51.5" stroke="#81d4fa" stroke-width="0.5" opacity="0.7"/>

  <!-- ===== CRUCIFORM STERN (rudder + planes) ===== -->
  <!-- Vertical fin above -->
  <path d="M 420,68 L 412,44 L 417,43 L 424,68 Z"
    fill="#0277bd" stroke="#4dd0e1" stroke-width="1.2"/>
  <!-- Vertical fin below -->
  <path d="M 420,92 L 412,116 L 417,117 L 424,92 Z"
    fill="#0277bd" stroke="#4dd0e1" stroke-width="1.2"/>
  <!-- Horizontal plane starboard -->
  <path d="M 418,76 L 397,65 L 399,68 L 419,79 Z"
    fill="#0277bd" stroke="#4dd0e1" stroke-width="1.2"/>
  <!-- Horizontal plane port -->
  <path d="M 418,84 L 397,95 L 399,92 L 419,81 Z"
    fill="#0277bd" stroke="#4dd0e1" stroke-width="1.2"/>

  <!-- Propeller shaft housing -->
  <rect x="436" y="77" width="14" height="6" rx="3" fill="#0277bd" stroke="#40c4ff" stroke-width="1"/>

  <!-- ===== 7-BLADE SKEW-BACK PROPELLER ===== -->
  <!-- Outer hub ring (static) -->
  <circle cx="448" cy="80" r="3" fill="#0277bd" stroke="#4dd0e1" stroke-width="0.8"/>
  <!-- Spinning group (1/3 scale) -->
  <g>
    <path d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(51.43 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(102.86 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(154.29 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(205.71 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(257.14 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <path transform="rotate(308.57 448 80)"
      d="M 448,80 C 449.7,79 450.7,75.7 449.3,72.7 C 448.7,71.7 447.3,71.7 446.3,72.7 C 445.3,75 446,79 448,80 Z"
      fill="url(#bladeGrad)" stroke="#b3e5fc" stroke-width="0.5"/>
    <circle cx="448" cy="80" r="2" fill="url(#propHub)" stroke="#40c4ff" stroke-width="0.4"/>
    <circle cx="448" cy="80" r="1" fill="#e1f5fe" opacity="0.9"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 448 80" to="360 448 80" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- ===== BUBBLES from propeller ===== -->
  <circle cx="459" cy="87" r="4.5" fill="none" stroke="#80deea" stroke-width="1.4">
    <animate attributeName="cy" from="87" to="53" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.8;0.6;0" dur="1.8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" from="4.5" to="8" dur="1.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="467" cy="74" r="3" fill="none" stroke="#b3e5fc" stroke-width="1.2">
    <animate attributeName="cy" from="74" to="44" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="opacity" values="0.7;0.5;0" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="r" from="3" to="6" dur="2.1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="461" cy="93" r="3.5" fill="none" stroke="#80deea" stroke-width="1.2">
    <animate attributeName="cy" from="93" to="62" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0.6;0.4;0" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="r" from="3.5" to="7" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="471" cy="82" r="2.5" fill="none" stroke="#b3e5fc" stroke-width="1">
    <animate attributeName="cy" from="82" to="55" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="opacity" values="0.7;0.4;0" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="r" from="2.5" to="5.5" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle cx="456" cy="70" r="2" fill="#b3e5fc" opacity="0.5">
    <animate attributeName="cy" from="70" to="42" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0.5;0.3;0" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="r" from="2" to="5" dur="2.0s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="469" cy="90" r="4" fill="none" stroke="#80deea" stroke-width="1.3">
    <animate attributeName="cy" from="90" to="58" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0.8;0.5;0" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="r" from="4" to="7.5" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="463" cy="99" r="2" fill="none" stroke="#4dd0e1" stroke-width="1">
    <animate attributeName="cy" from="99" to="72" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="opacity" values="0.6;0.3;0" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="r" from="2" to="4.5" dur="1.9s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Sonar rings at bow -->
  <ellipse cx="27" cy="80" rx="13" ry="9" fill="none" stroke="#40c4ff" stroke-width="0.9" opacity="0.2"/>
  <ellipse cx="27" cy="80" rx="22" ry="15" fill="none" stroke="#40c4ff" stroke-width="0.6" opacity="0.1"/>

  <!-- ===== 태극기 (Korean National Flag) ===== -->
  <line x1="158" y1="18" x2="158" y2="-18" stroke="#b3e5fc" stroke-width="1.5"/>
  <rect x="158" y="-20" width="30" height="18" fill="white" stroke="#c0c0c0" stroke-width="0.5" rx="0.5"/>
  <!-- Taeguk center (173,-11), radius 4.5, rotated -45° -->
  <g transform="rotate(-45 173 -11)">
    <path d="M 173,-15.5 A 4.5,4.5 0 0,1 173,-6.5 A 2.25,2.25 0 0,1 173,-11 A 2.25,2.25 0 0,0 173,-15.5 Z" fill="#cd2e3a"/>
    <path d="M 173,-15.5 A 4.5,4.5 0 0,0 173,-6.5 A 2.25,2.25 0 0,0 173,-11 A 2.25,2.25 0 0,1 173,-15.5 Z" fill="#003478"/>
  </g>
  <!-- 건(☰) top-left -->
  <g transform="rotate(45 160 -18)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="158" y1="-19.5" x2="162" y2="-19.5"/>
    <line x1="158" y1="-18.2" x2="162" y2="-18.2"/>
    <line x1="158" y1="-16.9" x2="162" y2="-16.9"/>
  </g>
  <!-- 감(☵) top-right -->
  <g transform="rotate(-45 185 -18)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="183" y1="-19.5" x2="184.5" y2="-19.5"/>
    <line x1="185.5" y1="-19.5" x2="187" y2="-19.5"/>
    <line x1="183" y1="-18.2" x2="187" y2="-18.2"/>
    <line x1="183" y1="-16.9" x2="184.5" y2="-16.9"/>
    <line x1="185.5" y1="-16.9" x2="187" y2="-16.9"/>
  </g>
  <!-- 리(☲) bottom-left -->
  <g transform="rotate(45 160 -4)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="158" y1="-5.5" x2="162" y2="-5.5"/>
    <line x1="158" y1="-4.2" x2="159.5" y2="-4.2"/>
    <line x1="160.5" y1="-4.2" x2="162" y2="-4.2"/>
    <line x1="158" y1="-2.9" x2="162" y2="-2.9"/>
  </g>
  <!-- 곤(☷) bottom-right -->
  <g transform="rotate(-45 185 -4)" stroke="#111" stroke-width="0.7" stroke-linecap="round">
    <line x1="183" y1="-5.5" x2="184.5" y2="-5.5"/>
    <line x1="185.5" y1="-5.5" x2="187" y2="-5.5"/>
    <line x1="183" y1="-4.2" x2="184.5" y2="-4.2"/>
    <line x1="185.5" y1="-4.2" x2="187" y2="-4.2"/>
    <line x1="183" y1="-2.9" x2="184.5" y2="-2.9"/>
    <line x1="185.5" y1="-2.9" x2="187" y2="-2.9"/>
  </g>
</svg>
